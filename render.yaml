# Render Blueprint: New → Blueprint → pick this repo. Creates the API service.
# The React frontend is deployed separately on Vercel (frontend/).
services:
  - type: web
    name: sbpo-link-tree-api
    runtime: node
    rootDir: server
    # NFC cards open /n/<slug> on this service. The free plan sleeps after ~15 min without traffic and the first
    # tap then waits up to a minute. Use a paid plan for cards you hand to customers.
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: COOKIE_SAMESITE
        value: strict
      # Asked for when the Blueprint is created. Fill them in the Render dashboard.
      - key: MONGODB_URI        # MongoDB Atlas connection string
        sync: false
      - key: ADMIN_PASSWORD     # long and unique
        sync: false
      - key: CLIENT_ORIGIN      # your Vercel address, e.g. https://sbpo-admin.vercel.app
        sync: false
