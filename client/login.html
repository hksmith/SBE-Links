<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · SBPO Link Tree</title>
  <link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/css/login.css">
</head>
<body>
  <form id="login-form" autocomplete="on">
    <h1>⚡ SBPO Link Tree admin</h1>
    <input id="u" name="username" placeholder="Username" autocomplete="username" required>
    <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
    <small id="e" role="alert"></small>
    <div class="by">Powered by Shaggar BPO Enterprise</div>
  </form>
  <script src="/admin/js/login.js"></script>
</body>
</html>
